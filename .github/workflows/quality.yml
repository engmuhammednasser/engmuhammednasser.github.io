name: Portfolio quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install locked package manifest
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Ensure Chromium is available
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium
            browser="$(command -v chromium)"
          fi
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"

      - name: Run supported verification pipeline
        run: npm run verify

      - name: Test site packaging rules
        run: npm run test:site-package

      - name: Build publishing directory
        run: npm run build:site

      - name: Verify the publishing directory
        run: npm run verify:site

      - name: Check Pages publishing mode
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mode="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          case "$mode" in
            workflow)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            legacy)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Artifact deployment is inactive: Pages still uses branch publishing." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unexpected Pages publishing mode."
              exit 1
              ;;
          esac

      - name: Upload verified site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: node_modules/.cache/pages/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.verify.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
